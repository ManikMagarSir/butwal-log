services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # No ports published: DB reachable only inside compose network, NOT on LAN.

  app:
    build: .
    restart: unless-stopped
    ports:
      # FRONTEND (+API) ONLY on LAN
      - "0.0.0.0:9090:3000"
    env_file:
      - .env
    environment:
      - PORT=3000  # container port; host published as 9090
      - MONGO_URI=mongodb://mongo:27017/logbook
    depends_on:
      - mongo

  mongo-express:
    image: mongo-express:1
    restart: unless-stopped
    ports:
      # Localhost only, never LAN.
      - "127.0.0.1:8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017/logbook
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongo
    profiles:
      - tools

volumes:
  mongo-data:
